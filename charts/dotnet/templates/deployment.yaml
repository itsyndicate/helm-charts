apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dotnet.fullname" . }}
  labels:
    {{- include "dotnet.labels" . | nindent 4 }}
  annotations:
    {{- $reload := list (printf "%s-env-secrets" (include "dotnet.fullname" .)) }}
    {{- with .Values.dotnet.env.existingSecretName }}
    {{- $reload = append $reload . }}
    {{- end }}
    {{- $reload = concat $reload (include "dotnet.extSecretNames" . | splitList "," | compact) }}
    secret.reloader.stakater.com/reload: {{ join ", " $reload | quote }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  {{- if not (kindIs "invalid" .Values.revisionHistoryLimit) }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "dotnet.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "dotnet.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "dotnet.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}-app
          securityContext:
            {{- toYaml .Values.dotnet.securityContext | nindent 12 }}
          image: "{{ .Values.dotnet.image.repository }}:{{ .Values.dotnet.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.dotnet.image.pullPolicy }}
          envFrom:
            - secretRef:
                name: {{ include "dotnet.fullname" . }}-env-secrets
            {{- if .Values.dotnet.env.existingSecretName }}
            - secretRef:
                name: {{ .Values.dotnet.env.existingSecretName }}
            {{- end }}
            {{- range (include "dotnet.extSecretNames" . | splitList "," | compact) }}
            - secretRef:
                name: {{ . }}
            {{- end }}
          ports:
            - name: {{ .Values.dotnet.port.name | default "http" }}
              containerPort: {{ .Values.dotnet.port.number | default "5001" }}
              protocol: {{ .Values.dotnet.port.protocol}}
          {{- if .Values.service.extraPorts }}
          {{- range .Values.service.extraPorts }}
            - name: {{ .name | default (printf "port-%d" .port) }}
              containerPort: {{ .port }}
              protocol: {{ .protocol | default "TCP" }}
          {{- end }}
          {{- end }}
          {{- with .Values.dotnet.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.dotnet.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.dotnet.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.dotnet.resources | nindent 12 }}
          {{- with .Values.dotnet.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
      {{- with .Values.dotnet.volumes }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
