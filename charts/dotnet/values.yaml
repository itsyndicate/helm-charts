# -- Number of replicas to sping up
replicaCount: 1
# -- Old ReplicaSets retained for rollback (set null to fall back to the Kubernetes default of 10)
revisionHistoryLimit: 3
# -- Secret that used to store docker registry credentials
imagePullSecrets: [ ]
# -- Overrides release name
nameOverride: ""
# -- Overrides full release name
fullnameOverride: ""
# -- Service Account
serviceAccount:
  # -- Specifies whether a service account should be created
  create: true
  # -- Automatically mount a ServiceAccount's API credentials?
  automount: true
  # -- Annotations to add to the service account
  annotations: { }
  # -- The name of the service account to use.
  name: ""
# -- Annotations to add to the pod
podAnnotations: { }
# -- Labels to add to the pod
podLabels: { }
# -- Security context of the pod
podSecurityContext: { }
# fsGroup: 2000

# -- Dotnet APP Specific Configurations
# @section -- Dotnet APP Settings
# @default -- A complex object. Please check values below
dotnet:
  # -- Dotnet APP image settings
  # @section -- Dotnet APP Settings
  image:
    repository: mcr.microsoft.com/dotnet/samples
    pullPolicy: IfNotPresent
    # -- Overrides the image tag whose default is the chart appVersion
    # @section -- Dotnet APP Settings
    tag: ""
  # -- Dotnet APP container security context
  # @section -- Dotnet APP Settings
  securityContext: { }
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000
  # -- Dotnet APP container resources
  # @section -- Dotnet APP Settings
  resources: { }
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi
  # -- Dotnet APP container startup probe. Not rendered unless set.
  # @section -- Dotnet APP Settings
  startupProbe: {}
  #  httpGet:
  #    path: /
  #    port: http
  #  periodSeconds: 5
  #  failureThreshold: 30
  # -- Dotnet APP container readiness probe. Not rendered unless set.
  # @section -- Dotnet APP Settings
  readinessProbe: {}
  #  httpGet:
  #    path: /
  #    port: http
  #  periodSeconds: 10
  # -- Dotnet APP container liveness probe. Not rendered unless set.
  # @section -- Dotnet APP Settings
  livenessProbe: {}
  #  httpGet:
  #    path: /
  #    port: http
  # -- Dotnet APP container additional volumes
  # @section -- Dotnet APP Settings
  volumes: [ ]
  # - name: foo
  #   secret:
  #     secretName: mysecret
  #     optional: false

  # -- Dotnet APP container additional volumes mounts
  # @section -- Dotnet APP Settings
  volumeMounts: [ ]
  # - name: foo
  #   mountPath: "/etc/foo"
  #   readOnly: true
  # -- Dotnet APP environment variables
  # @section -- Dotnet APP Settings
  port:
    number: 5001
    name: http
    protocol: TCP
  env:
    # -- Name of an existing Secret to mount as env (e.g. one managed by External Secrets Operator).
    # Mounted additively alongside `variables` and `envFromSecretsManager` — it does NOT disable
    # `variables`. On key collisions the existing Secret wins over `variables`, and
    # `envFromSecretsManager` wins over both.
    # @section -- Dotnet APP Settings
    existingSecretName: ""
    # -- Use AWS secrets manager ref. Works with external-secrets operator. Each path renders its own
    # ExternalSecret, mounted as env after `existingSecretName`.
    # @section -- Dotnet APP Settings
    envFromSecretsManager:
      # -- Render the ExternalSecrets and mount them as env
      # @section -- Dotnet APP Settings
      enabled: false
      # -- Single secret path, e.g. `dev/example-com/env-secrets`. Set either this or `secretPaths`;
      # setting both fails the render, and so does setting neither while `enabled` is true.
      # @section -- Dotnet APP Settings
      secretPath: ""
      # -- Secret paths mounted in list order. On key collisions a later path wins over an earlier one.
      # Set either this or `secretPath`.
      # @section -- Dotnet APP Settings
      secretPaths: []
      #  - dev/example-com/shared-env
      #  - dev/example-com/env-secrets
      # -- Name of the secret store the ExternalSecrets reference
      # @section -- Dotnet APP Settings
      secretStoreName: global-secret-store
      # -- Kind of the secret store: ClusterSecretStore or SecretStore
      # @section -- Dotnet APP Settings
      secretStoreKind: ClusterSecretStore
      # -- How often External Secrets Operator refreshes the secrets
      # @section -- Dotnet APP Settings
      refreshInterval: 1m
    # -- Extra plain (non-secret) env variables. Always injected, even when existingSecretName is set.
    # @section -- Dotnet APP Settings
    variables: {}
    #  APP_DOMAIN: "example.com"


# -- Service settings
# @section -- Networking Settings
#service:
#  type: ClusterIP
#  port: 5001
#  ## @param service.extraPorts Extra ports to expose
#  ##
#  extraPorts: []
service:
  name: http
  port: 5001
  targetPort: http
  protocol: TCP
  appProtocol: http
  type: ClusterIP
  extraPorts: []
# -- Ingress settings
# @section -- Networking Settings
ingress:
  # -- Enables ingress when true
  enabled: false
  className: ""
  annotations: { }
  # kubernetes.io/ingress.class: nginx
  # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: [ ]
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local
# -- Autoscaling settings
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# -- Pod Disruption Budget settings
# @section -- PDB Settings
pdb:
  create: false
  # minAvailable: 1
  # maxUnavailable: 1

# -- Node selector settings
nodeSelector: { }
# -- Tolerations settings
tolerations: [ ]
# -- Affinity settings
affinity: { }
