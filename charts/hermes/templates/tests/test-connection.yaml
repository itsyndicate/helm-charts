apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "hermes.fullname" . }}-test-connection"
  labels:
    {{- include "hermes.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args: ['-qO-', 'http://{{ include "hermes.fullname" . }}:{{ .Values.hermes.api.port }}/health']
  restartPolicy: Never
