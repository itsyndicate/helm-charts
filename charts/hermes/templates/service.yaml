apiVersion: v1
kind: Service
metadata:
  name: {{ include "hermes.fullname" . }}
  labels:
    {{- include "hermes.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: api
      port: {{ .Values.hermes.api.port }}
      targetPort: api
      protocol: TCP
      appProtocol: http
    {{- if .Values.hermes.dashboard.enabled }}
    - name: dashboard
      port: {{ .Values.hermes.dashboard.port }}
      targetPort: dashboard
      protocol: TCP
      appProtocol: http
    {{- end }}
  selector:
    {{- include "hermes.selectorLabels" . | nindent 4 }}
