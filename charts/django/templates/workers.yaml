{{- range $worker := $.Values.django.workers }}
{{- if $worker.enabled -}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "django.fullname" $ }}-worker-{{ $worker.name }}
  labels:
    {{- include "django.labels" $ | nindent 4 }}
  annotations:
    {{- $reload := list (printf "%s-env-secrets" (include "django.fullname" $)) }}
    {{- with $.Values.django.env.existingSecretName }}
    {{- $reload = append $reload . }}
    {{- end }}
    {{- $reload = concat $reload (include "django.extSecretNames" $ | splitList "," | compact) }}
    secret.reloader.stakater.com/reload: {{ join ", " $reload | quote }}
spec:
  {{- if not $worker.autoscaling.enabled }}
  replicas: {{ $worker.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "django.selectorLabels" $ | nindent 6 }}
  template:
    metadata:
      {{- with $.Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "django.labels" $ | nindent 8 }}
        {{- with $.Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "django.serviceAccountName" $ }}
      securityContext:
        {{- toYaml $.Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ $.Chart.Name }}-{{ $worker.name }}
          securityContext:
            {{- toYaml $worker.securityContext | nindent 12 }}
          image: "{{ $.Values.django.image.repository }}:{{ $.Values.django.image.tag | default $.Chart.AppVersion }}"
          imagePullPolicy: {{ $.Values.django.image.pullPolicy }}
          {{- if $worker.containerCommand }}
          command: {{- range $worker.containerCommand }}
            - {{ . }} {{- end}}
          {{- end }}
          envFrom:
            - secretRef:
                name: {{ include "django.fullname" $ }}-env-secrets
            {{- if $.Values.django.env.existingSecretName }}
            - secretRef:
                name: {{ $.Values.django.env.existingSecretName }}
            {{- end }}
            {{- range (include "django.extSecretNames" $ | splitList "," | compact) }}
            - secretRef:
                name: {{ . }}
            {{- end }}
          livenessProbe:
            {{- toYaml $worker.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml $worker.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml $worker.resources | nindent 12 }}
          volumeMounts:
            {{- with $worker.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      {{- with $worker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $worker.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $worker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        {{- with $worker.extraVolumes }}
        {{- toYaml . | nindent 12 }}
        {{- end }}
{{- end }}
{{- end }}
