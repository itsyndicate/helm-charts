# Plain (non-secret) extra env vars from .Values.django.env.variables.
# Always rendered so these vars are injected even when an existingSecretName
# is set — the two are additive, not mutually exclusive.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "django.fullname" . }}-env-secrets
type: Opaque
data:
  {{- range $key, $val := .Values.django.env.variables }}
  {{ $key }}: {{ $val | b64enc }}
  {{- end}}

{{- include "django.validateSecretsManager" . }}
{{- $sm := .Values.django.env.envFromSecretsManager }}
{{- if $sm.enabled }}
{{- $paths := $sm.secretPaths | default (list $sm.secretPath) }}
{{- $names := include "django.extSecretNames" . | splitList "," }}
{{- range $i, $path := $paths }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ index $names $i }}
spec:
  refreshInterval: {{ $sm.refreshInterval | default "1m" }}
  secretStoreRef:
    name: {{ $sm.secretStoreName | default "global-secret-store" }}
    kind: {{ $sm.secretStoreKind | default "ClusterSecretStore" }}
  target:
    name: {{ index $names $i }}
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ $path }}
{{- end }}
{{- end }}
