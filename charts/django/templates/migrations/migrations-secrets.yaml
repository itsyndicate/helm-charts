{{- if .Values.django.migrationJob.enabled -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "django.fullname" . }}-env-migration-secrets
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": hook-succeeded
type: Opaque
data:
  {{- range $key, $val := .Values.django.env.variables }}
  {{ $key }}: {{ $val | b64enc }}
  {{- end}}

{{- include "django.validateSecretsManager" . }}
{{- $sm := .Values.django.env.envFromSecretsManager }}
{{- if $sm.enabled }}
{{- $paths := $sm.secretPaths | default (list $sm.secretPath) }}
{{- $names := include "django.migrationExtSecretNames" . | splitList "," }}
{{- range $i, $path := $paths }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ index $names $i }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": hook-succeeded
spec:
  refreshInterval: {{ $sm.refreshInterval | default "1m" }}
  secretStoreRef:
    name: {{ $sm.secretStoreName | default "global-secret-store" }}
    kind: {{ $sm.secretStoreKind | default "ClusterSecretStore" }}
  target:
    name: {{ index $names $i }}
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ $path }}
{{- end }}
{{- end }}
{{- end }}
