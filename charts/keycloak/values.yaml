# Every value is real YAML (lists and maps). Only the strings marked "rendered with tpl" go through `tpl`.
# Values layers (Flux valuesFrom, several -f files) merge maps key by key but replace lists whole.

# -- Overrides the chart name (`app.kubernetes.io/name`). Part of the StatefulSet selector: changing it later
# forces a delete and recreate of the StatefulSet.
nameOverride: ""
# -- Overrides the full resource name. Not part of any selector.
fullnameOverride: ""
# -- Labels added to every resource, e.g. `app.kubernetes.io/part-of` or an `owner` label an admission policy needs.
# The keys the chart sets itself are rejected: `app.kubernetes.io/name`, `instance`, `component`, `version`,
# `managed-by` and `helm.sh/chart`.
commonLabels: {}

# -- Keycloak image, rendered as `repository:tag[@digest]`
# @section -- Image
image:
  # -- Image repository. A registry mirror or a pre-built image (`optimized`) goes here.
  # @section -- Image
  repository: quay.io/keycloak/keycloak
  # -- Keycloak version. Required: the chart never defaults it to its appVersion, so a chart upgrade alone never
  # changes the Keycloak version. Changing it is a Keycloak upgrade: read README "Upgrading Keycloak" first. The
  # tag must start with the Keycloak version (`26.8.2`, `26.8.2-custom`): `upgradeGuard` reads the version from it.
  # @section -- Image
  tag: ""
  # -- Image digest (`sha256:...`). With it set the digest is what runs and the tag stays readable.
  # @section -- Image
  digest: ""
  # -- Image pull policy
  # @section -- Image
  pullPolicy: IfNotPresent
# -- Registry credentials for private images (list of `{name: <secret>}`)
# @section -- Image
imagePullSecrets: []

# -- Pass `--optimized` to `kc.sh start`. Only for images pre-built with `kc.sh build`; the stock image is not.
# 26.8.2 refuses to start (exit code 2) when a build-time option differs from the build, so build the image with
# the same `db`, `features`, `http-relative-path`, `http-management-relative-path`, `health-enabled=true` and
# `metrics-enabled=true`, and with every build-time option you set through `config`. The `cache*` options are not
# build-time. Not possible together with `providers` entries of `target: providers`.
# @section -- Keycloak
optimized: false
# -- Extra arguments after `start [--optimized]`. The chart always runs `start`, never `start-dev`. `--config-file`
# does not work here (a global option, it must come before `start`): set `KC_CONFIG_FILE` through `extraEnv`.
# @section -- Keycloak
extraArgs: []

# -- Public and admin URLs of Keycloak
# @section -- Keycloak
hostname:
  # -- Public URL of Keycloak (KC_HOSTNAME), e.g. `https://id.example.com/`. Rendered with tpl. Required unless
  # `hostname.strict` is false. Its host is also the default Ingress and HTTPRoute host. Give the full `https://`
  # URL, not a bare host name: with it plain-HTTP calls inside the cluster (the realm-import hook, the test) also
  # work from pod IPs outside RFC 1918 (e.g. EKS 100.64.0.0/10), which otherwise get a 403.
  # @section -- Keycloak
  url: ""
  # -- Admin console URL (KC_HOSTNAME_ADMIN), e.g. an internal host served by `ingress.admin`. Rendered with tpl
  # twice, so `"{{ .Values.hostname.url }}"` works even when `hostname.url` is a template itself. Empty: the console
  # answers on the public URL.
  # @section -- Keycloak
  adminUrl: ""
  # -- KC_HOSTNAME_STRICT. Leave it true: once `url` is set, false changes nothing, and without a URL it lets
  # Keycloak take its host name from request headers.
  # @section -- Keycloak
  strict: true

# -- HTTP listener and the management interface
# @section -- Keycloak
http:
  # -- Plain HTTP listener (KC_HTTP_ENABLED). On by default: TLS usually ends at the load balancer.
  # @section -- Keycloak
  enabled: true
  # -- Container port of http (KC_HTTP_PORT). The Service port is `service.port`.
  # @section -- Keycloak
  port: 8080
  # -- KC_HTTP_RELATIVE_PATH. `/` keeps every URL and the token issuer at the root.
  # @section -- Keycloak
  relativePath: /
  # -- Management port: `/health/*` and `/metrics` (KC_HTTP_MANAGEMENT_PORT). Never exposed on the Ingress.
  # Health and metrics are always enabled: the probes need health, and the database check of `/health/ready` only
  # exists while metrics are enabled.
  # @section -- Keycloak
  managementPort: 9000
  # -- KC_HTTP_MANAGEMENT_RELATIVE_PATH. Empty inherits `relativePath`, as Keycloak does. Probes and the
  # ServiceMonitor follow it.
  # @section -- Keycloak
  managementRelativePath: ""

# -- HTTPS listener with a `kubernetes.io/tls` Secret mounted as files (KC_HTTPS_CERTIFICATE_FILE /
# KC_HTTPS_CERTIFICATE_KEY_FILE)
# @section -- Keycloak
https:
  # -- Enable the HTTPS listener. Needs `certificateSecret`. The management port (probes, metrics) then speaks HTTPS
  # too. While `http.enabled` is also true, the Ingress, HTTPRoute, hook and test keep using http.
  # @section -- Keycloak
  enabled: false
  # -- Container port of https (KC_HTTPS_PORT). The Service port is `service.httpsPort`.
  # @section -- Keycloak
  port: 8443
  # -- Name of the `kubernetes.io/tls` Secret (`tls.crt`, `tls.key`)
  # @section -- Keycloak
  certificateSecret: ""

# -- Reverse proxy headers
# @section -- Keycloak
proxy:
  # -- Which proxy headers to trust (KC_PROXY_HEADERS): `xforwarded`, `forwarded` or empty for none. Set it only
  # when every request comes through the proxy, otherwise clients can spoof their address and scheme. Empty behind
  # a TLS-terminating load balancer (an https `hostname.url`): Keycloak logs a "Likely misconfiguration" warning
  # and records the load balancer's address as the client.
  # @section -- Keycloak
  headers: ""
  # -- Proxies allowed to set those headers (KC_PROXY_TRUSTED_ADDRESSES): comma-separated IPs or CIDRs, rendered
  # only while `headers` is set. Empty: Keycloak accepts the headers from any peer. Keycloak takes the leftmost
  # `X-Forwarded-For` element, so the proxy must overwrite the header, not append to it (an AWS ALB only appends),
  # or the client address stays client-controlled. List the proxy's own addresses or subnets, not a range that
  # also holds pods or nodes: every peer in it can send forged headers to the http port.
  # @section -- Keycloak
  trustedAddresses: ""

# -- Plain Keycloak options as `<option-name>: <value>`, rendered into the env ConfigMap as `KC_<OPTION_NAME>`.
# A map, so values layers (e.g. Flux valuesFrom) merge key by key; null drops a default. The chart refuses to render
# the options that have a dedicated value (`db`, `db-url*`, `db-schema`, `db-username`, `hostname`, `hostname-admin`,
# `hostname-strict`, `proxy-headers`, `proxy-trusted-addresses`, ports and relative paths, `http-management-*`,
# `health-enabled`, `metrics-enabled`, `cache`, `cache-stack`, the TLS certificate files, `bootstrap-admin-*`) and
# every name ending in `password`, `secret` or `-pass`: secrets go through the `database`, `bootstrapAdmin` or
# `extraEnv` secret references, never into a ConfigMap. The error names the option.
# @section -- Keycloak
config:
  # -- Keep serving this long after SIGTERM, while readiness already fails, so load balancers drain first (Keycloak
  # default: 1s). `terminationGracePeriodSeconds` must stay above shutdown-delay + shutdown-timeout (10s).
  # @section -- Keycloak
  shutdown-delay: 15s
  # -- Structured logs. About ten lines per start stay plain text (messages of kc.sh and of the build JVM).
  # @section -- Keycloak
  log-console-output: json
#  log-level: INFO
#  features: token-exchange

# -- JVM options. Never set JAVA_OPTS: it replaces the kc.sh defaults, including the heap `-XX:MaxRAMPercentage=70`.
# @section -- Keycloak
jvm:
  # -- JDK_JAVA_OPTIONS, read by the java launcher itself (log line `NOTE: Picked up JDK_JAVA_OPTIONS`).
  # E.g. `-Djava.net.preferIPv4Stack=true`.
  # @section -- Keycloak
  jdkJavaOptions: ""
  # -- JAVA_OPTS_APPEND, appended by kc.sh after its defaults. With `cache.stack: kubernetes` the chart prepends
  # `-Djgroups.dns.query=<headless>.<namespace>.svc.cluster.local`; another `-Djgroups.dns.query` here wins, which
  # a cluster domain other than `cluster.local` needs.
  # @section -- Keycloak
  javaOptsAppend: ""

# -- External database. Each field takes either `value` or `secretKeyRef: {name, key}`; both render into the
# container `env`, and `secretKeyRef` wins. An empty `secretKeyRef.name` means the Secret of the chart's own
# ExternalSecret. `host` or `url` is required.
# @section -- Database
# @default -- A complex object. Please check values below
database:
  # -- KC_DB: postgres, mysql, mariadb, mssql, oracle
  # @section -- Database
  vendor: postgres
  # -- KC_DB_URL_HOST
  # @section -- Database
  host:
    value: ""
    secretKeyRef: {}
  # -- KC_DB_URL_PORT. Empty lets Keycloak use the vendor's default port. Also the egress port of the NetworkPolicy.
  # @section -- Database
  port:
    value: ""
    secretKeyRef: {}
  # -- KC_DB_URL_DATABASE
  # @section -- Database
  database:
    value: ""
    secretKeyRef: {}
  # -- KC_DB_SCHEMA. When this chart takes over an existing database, set the schema that database uses: with
  # another one Keycloak initialises a new, empty schema.
  # @section -- Database
  schema:
    value: ""
    secretKeyRef: {}
  # -- KC_DB_USERNAME
  # @section -- Database
  username:
    value: ""
    secretKeyRef: {}
  # -- KC_DB_PASSWORD. Secret only: the schema rejects `value`. Leave it unset when Keycloak reads the password
  # from a mounted `keycloak.conf` instead of the environment (README "Database and secrets"). Keycloak reads `$$`
  # in the value as `$`, and silently drops a value that contains a `${...}` it cannot resolve.
  # @section -- Database
  password:
    secretKeyRef: {}
  # -- KC_DB_URL, a full JDBC URL. Overrides host, port and database.
  # @section -- Database
  url:
    value: ""
    secretKeyRef: {}
  # -- KC_DB_URL_PROPERTIES with the leading `?`, e.g. `?sslmode=require`
  # @section -- Database
  urlProperties: ""

# -- Temporary admin: a user, a service account, or both (`KEYCLOAK_ADMIN` is deprecated). Applied only when the
# master realm is created, i.e. on the first start against an empty database: on an existing database it does
# nothing, and changing the Secret later changes nothing in Keycloak. Create a permanent admin of the master realm
# and check that it works before you remove the temporary one: without one nobody can administer the master realm
# any more, and the chart has no way back. Then remove `bootstrapAdmin` from your values, so the credential does
# not stay in the pod. Same `value` / `secretKeyRef` shape as `database`. The realm-import hook has its own
# credentials (`realmImport.auth`).
# @section -- Database
# @default -- A complex object. Please check values below
bootstrapAdmin:
  # -- KC_BOOTSTRAP_ADMIN_USERNAME
  # @section -- Database
  username:
    value: admin
    secretKeyRef: {}
  # -- KC_BOOTSTRAP_ADMIN_PASSWORD. Secret only. The temporary user is not rendered while this is unset.
  # @section -- Database
  password:
    secretKeyRef: {}
  # -- Temporary admin service account (KC_BOOTSTRAP_ADMIN_CLIENT_ID / KC_BOOTSTRAP_ADMIN_CLIENT_SECRET), independent
  # of the user above and under the same rules. Not rendered while the secret is unset. An empty `id` leaves
  # Keycloak's default, `temp-admin`.
  # @section -- Database
  client:
    # -- KC_BOOTSTRAP_ADMIN_CLIENT_ID
    # @section -- Database
    id:
      value: ""
      secretKeyRef: {}
    # -- KC_BOOTSTRAP_ADMIN_CLIENT_SECRET. Secret only.
    # @section -- Database
    secret:
      secretKeyRef: {}

# -- Infinispan clustering
# @section -- Cache
cache:
  # -- KC_CACHE: `ispn` (clustered) or `local` (single node only)
  # @section -- Cache
  type: ispn
  # -- KC_CACHE_STACK: `jdbc-ping` (default since 26.1, nodes find each other through the database) or
  # `kubernetes` (DNS_PING on the headless Service, deprecated since 26.3). Changing it needs every node stopped.
  # The schema takes Keycloak's built-in stacks only; a custom one goes through `extraEnv` (KC_CACHE_STACK).
  # @section -- Cache
  stack: jdbc-ping
  # -- Set KC_CACHE_EMBEDDED_NODE_NAME from the pod name, as the 26.8 upgrading guide recommends for non-operator
  # setups. The option exists since 26.8.0: set it to false for older images (26.1.4 ignored the variable).
  # @section -- Cache
  nodeNameFromPod: true

# -- Provider JARs and themes copied from images. A map, so values layers merge per entry: a base can set `source`
# and an env overlay only `image` (where a Flux `$imagepolicy` marker works on the plain `image:` line).
# Each entry renders an init container `provider-<name>` that runs `cp -R -- <source>/. /target/`, where `/target` is
# an emptyDir mounted read-only in Keycloak at `/opt/keycloak/providers` (`target: providers`, the default) or
# `/opt/keycloak/themes` (`target: themes`). The emptyDir hides anything a custom image baked into that directory.
# The image needs `sh` and `cp`, and its files must be readable by uid 1000. `command` replaces the copy command
# and must write to `/target`.
# @section -- Providers
providers: {}
#  example-theme:
#    image: 123456789012.dkr.ecr.us-east-1.amazonaws.com/my-theme:1.0.0 # {"$imagepolicy": "flux-system:my-theme"}
#    imagePullPolicy: IfNotPresent
#    source: /theme
#    target: providers
#    command: []
# -- Resources of the init containers the chart renders (the lib/quarkus seed and the providers)
# @section -- Providers
initContainerResources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 64Mi

# -- Pod replicas. Ignored while `autoscaling.enabled`. With 1, every config change, Secret rotation and node
# drain is one boot of downtime. 0 stops Keycloak (a step of the upgrade runbook); the realm-import hook is then
# not rendered and `helm test` cannot pass.
# @section -- Workload
replicaCount: 1
# -- ControllerRevisions the StatefulSet keeps (null falls back to the Kubernetes default of 10). Helm rollback does
# not use them.
# @section -- Workload
revisionHistoryLimit: 3
# -- `Parallel` creates and deletes pods at once when scaling, `OrderedReady` one by one. Updates always go one pod
# at a time. Immutable on a StatefulSet.
# @section -- Workload
podManagementPolicy: Parallel
# -- StatefulSet update strategy. `RollingUpdate` is right for config changes and, as a rule, for patch releases
# inside one major.minor (read the release notes: a single patch can be excluded). A minor or major upgrade
# migrates the schema one way and must not run next to the old version: stop every pod first (scale to 0), see
# README "Upgrading Keycloak". The chart refuses to render a `RollingUpdate` onto another major.minor while more
# than one pod runs or is wanted (`upgradeGuard`). With `OnDelete` nothing is upgraded until the pods are deleted,
# and `helm upgrade --wait` (or Flux) reports success at once.
# @section -- Workload
updateStrategy:
  type: RollingUpdate
# -- Refuse to render a `RollingUpdate` onto another Keycloak major.minor while more than one pod runs or is wanted
# (see `updateStrategy`). The versions are read from the image tags of the live StatefulSet and of `image.tag`, so
# a tag must start with the Keycloak version (`26.8.2`, `26.8.2-custom`): turn the guard off for images tagged
# differently. The live StatefulSet is read with `lookup`, so the guard is inert under `helm template` and Argo CD.
# It does not compare patch releases or the cache stack. A rollback (`helm rollback`, Flux remediation) does not
# render the chart and so never meets it.
# @section -- Workload
upgradeGuard: true
# -- Seconds between SIGTERM and SIGKILL. Keep it above `config.shutdown-delay` + shutdown-timeout (10s).
# @section -- Workload
terminationGracePeriodSeconds: 60
# -- Container resources. No CPU limit: the boot-time re-augmentation and JIT warm-up are CPU-heavy and a limit only
# throttles them. Memory: kc.sh sizes the heap at 70% of the limit, non-heap took 303-327 MiB on an idle pod, and
# the upstream baseline is 1250 MB per pod. The boot-time build JVM needs about 750 MB. `1280Mi` is the minimum
# with kc.sh's default heap percentages (README "Sizing").
# @section -- Workload
resources:
  requests:
    cpu: 500m
    memory: 1536Mi
  limits:
    memory: 1536Mi

# -- Startup probe on `<management path>/health/started`. The chart sets `httpGet`; only timings live here. Since
# 26.6 Keycloak starts asynchronously: on 26.8.2 `/health/started` and `/health/live` have no checks and pass
# before the schema migration ends, so this probe does not gate a migration: the Helm (or Flux) wait timeout does,
# through readiness. An image older than 26.6, or `server-async-bootstrap=false`, starts synchronously: there this
# probe does gate the migration, so size it for that.
# @section -- Probes
startupProbe:
  enabled: true
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 90
# -- Liveness probe on `<management path>/health/live`. Kept loose: a restart never fixes a slow database.
# @section -- Probes
livenessProbe:
  enabled: true
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 5
# -- Readiness probe on `<management path>/health/ready` (HTTP, not TCP: since 26.6 the ports open before init ends)
# @section -- Probes
readinessProbe:
  enabled: true
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3

# -- ServiceAccount. Keycloak does not call the Kubernetes API with either cache stack.
# @section -- Security
serviceAccount:
  # -- Create the ServiceAccount. False: use the existing one named in `name` (empty: `default`).
  # @section -- Security
  create: true
  # -- Name (a lowercase DNS name). Empty uses the full name. Keep it stable when an IAM trust policy references
  # it.
  # @section -- Security
  name: ""
  # -- Annotations, e.g. `eks.amazonaws.com/role-arn`
  # @section -- Security
  annotations: {}
  # -- Mount the API token into the pod
  # @section -- Security
  automountServiceAccountToken: false
# -- Pod security context (restricted Pod Security Standard). uid 1000 is the keycloak user of the official image.
# @section -- Security
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault
# -- Security context of every container the chart renders (Keycloak, init containers, hooks)
# @section -- Security
securityContext:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
# -- Size limits of the emptyDirs behind the read-only root: `/tmp`, `/opt/keycloak/data` (transaction logs) and,
# unless `optimized`, `/opt/keycloak/lib/quarkus`. A non-optimized `start` re-augments into lib/quarkus at boot, and
# an empty dir there fails (`quarkus-application.dat` missing). An init container from the Keycloak image copies the
# image's lib/quarkus (2-5 MiB) into a second emptyDir of the `quarkus` limit, and every container start copies it
# from there, so a start killed half-way does not break the next one.
# @section -- Security
emptyDirSizeLimits:
  tmp: 256Mi
  data: 256Mi
  quarkus: 64Mi
  # -- Each of the `providers` and `themes` emptyDirs
  # @section -- Security
  providers: 256Mi

# -- Service for HTTP(S). The management port is only on the headless Service.
# @section -- Networking
service:
  # -- Service type. ClusterIP is enough behind an ALB with `target-type: ip` or a Gateway.
  # @section -- Networking
  type: ClusterIP
  # -- Service port of http. Empty: the container port (`http.port`). The HTTPRoute, the realm-import hook and the
  # test follow it; the headless Service keeps the container ports. When this chart replaces another release, keep
  # the port the old Service had (e.g. 80): clients inside the cluster may use it.
  # @section -- Networking
  port: ""
  # -- Service port of https. Empty: the container port (`https.port`).
  # @section -- Networking
  httpsPort: ""
  # -- Annotations, e.g. ALB health-check settings for `target-type: ip`
  # @section -- Networking
  annotations: {}
  # -- Extra labels. The keys the chart sets itself are rejected (see `commonLabels`).
  # @section -- Networking
  labels: {}

# -- Ingress (networking.k8s.io/v1) to the http port: the public entry point
# @section -- Networking
# @default -- A complex object. Please check values below
ingress:
  # -- Render the public Ingress
  # @section -- Networking
  enabled: false
  # -- IngressClass name
  # @section -- Networking
  className: ""
  # -- Annotations (string values only), e.g. the `alb.ingress.kubernetes.io/*` settings and
  # `external-dns.alpha.kubernetes.io/hostname`
  # @section -- Networking
  annotations: {}
  # -- Host. Rendered with tpl. Empty takes the host of `hostname.url`.
  # @section -- Networking
  host: ""
  # -- Paths to the http port, by default the ones Keycloak's reverse-proxy guide says to expose, plus `/robots.txt`.
  # They assume `http.relativePath: /`: prefix them yourself otherwise. The admin console needs `/admin/`, left out:
  # serve it through `ingress.admin`. `/realms/` still includes the master realm's login and token endpoints: to
  # keep them off the public entry point list per-realm prefixes (`/realms/<realm>/`) instead, or deny
  # `/realms/master/` with a per-path `backend`. `path: /` is for an internal-only entry point.
  # An entry may set `backend` (an IngressBackend), rendered as is instead of the chart's Service, e.g. an ALB
  # `use-annotation` fixed-response action that answers 403.
  # @section -- Networking
  paths:
    - path: /realms/
      pathType: Prefix
    - path: /resources/
      pathType: Prefix
    - path: /.well-known/
      pathType: Prefix
    - path: /robots.txt
      pathType: Exact
  #  - path: /realms/master/
  #    pathType: Prefix
  #    backend: {service: {name: deny, port: {name: use-annotation}}}
  # -- TLS entries (`[{secretName, hosts}]`). Empty `hosts` take `host`, or are left out when there is no host. Leave
  # empty when TLS ends at the load balancer.
  # @section -- Networking
  tls: []
  # -- A second Ingress `<fullname>-admin` with its own class, annotations and host, e.g. an internal load
  # balancer or a source-IP allow list. Independent of `ingress.enabled`. Empty `host` takes the host of
  # `hostname.adminUrl`, then the main Ingress host.
  # @section -- Networking
  admin:
    # -- Render the admin Ingress
    # @section -- Networking
    enabled: false
    # -- IngressClass name, e.g. the class of an internal load balancer
    # @section -- Networking
    className: ""
    # -- Annotations (string values only)
    # @section -- Networking
    annotations: {}
    # -- Host. Rendered with tpl. Empty takes the host of `hostname.adminUrl`, then the main Ingress host.
    # @section -- Networking
    host: ""
    # -- Paths. Empty: `<relativePath>admin/`. On a separate admin host (with `hostname.adminUrl` pointing at it)
    # also add `/realms/master/` and `/resources/`. Entries take `backend` like `ingress.paths`.
    # @section -- Networking
    paths: []
    # -- TLS entries, as `ingress.tls`
    # @section -- Networking
    tls: []

# -- Gateway API HTTPRoute (gateway.networking.k8s.io/v1)
# @section -- Networking
# @default -- A complex object. Please check values below
httpRoute:
  # -- Render the HTTPRoute
  # @section -- Networking
  enabled: false
  # -- Annotations (string values only)
  # @section -- Networking
  annotations: {}
  # -- Extra labels
  # @section -- Networking
  labels: {}
  # -- Gateways to attach to, e.g. `[{name: public, namespace: gateway, sectionName: https}]`. Required when enabled.
  # @section -- Networking
  parentRefs: []
  # -- Hostnames. Rendered with tpl. Empty takes the host of `hostname.url`.
  # @section -- Networking
  hostnames: []
  # -- HTTPRouteRules (matches, filters, backendRefs, timeouts), by default the public paths of `ingress.paths`: see
  # there for `http.relativePath` and the master realm. The admin console needs `/admin/`: a second HTTPRoute on an
  # internal Gateway (`extraObjects`). A rule without the `backendRefs` key goes to the chart's Service on its http
  # port; a rule that has the key, even `backendRefs: []`, and a RequestRedirect rule are left as they are.
  # @section -- Networking
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /realms/
        - path:
            type: PathPrefix
            value: /resources/
        - path:
            type: PathPrefix
            value: /.well-known/
        - path:
            type: Exact
            value: /robots.txt

# -- NetworkPolicy, default deny, of the Keycloak pods. Always allowed: DNS to kube-system, and all traffic between
# this release's pods (clustering on 7800/57800, the hook and test pods). DNS egress is allowed to the `kube-system`
# namespace only: NodeLocal DNSCache (169.254.20.10) or a DNS namespace other than kube-system needs an `extraEgress`
# `ipBlock` / `namespaceSelector` rule. With `realmImport` or `tests` enabled a second policy `<fullname>-hooks`
# gives those pods egress to DNS and to Keycloak only; `extraEgress` does not reach it (policies add up: bring your
# own through `extraObjects`).
# @section -- Networking
networkPolicy:
  # -- Render the NetworkPolicies. They only act when the cluster's CNI enforces NetworkPolicy.
  # @section -- Networking
  enabled: false
  # -- Peers allowed to the http(s) port: ingress controller or gateway pods, or the load balancer subnets
  # (`ipBlock`) for ALB `target-type: ip`. Give the load balancer subnets of its own: an `ipBlock` that also holds
  # pods or nodes opens the port to them.
  # @section -- Networking
  ingressFrom: []
  # -- Peers allowed to the management port, e.g. Prometheus
  # @section -- Networking
  metricsFrom: []
  # -- Egress peers of the database (`ipBlock` of the RDS subnets), on `database.port.value`, else the vendor's
  # default port. The policy cannot read Secrets: when the port comes from a `secretKeyRef` or from `database.url`,
  # also set `database.port.value`.
  # @section -- Networking
  databaseTo: []
  # -- Extra ingress rules (NetworkPolicyIngressRule list)
  # @section -- Networking
  extraIngress: []
  # -- Extra egress rules (NetworkPolicyEgressRule list). Every outbound call of Keycloak needs one: identity
  # brokering and social login (443), SMTP, LDAP, NodeLocal DNSCache.
  # @section -- Networking
  extraEgress: []

# -- ExternalSecret (external-secrets.io/v1) whose Secret the `secretKeyRef`s with an empty name point to
# @section -- Secrets
# @default -- A complex object. Please check values below
externalSecret:
  # -- Render the ExternalSecret. Leave it off when the Secret already exists (e.g. synced by an ExternalSecret
  # outside the chart) and name that Secret in the `secretKeyRef`s.
  # @section -- Secrets
  enabled: false
  # -- Name of the ExternalSecret and its Secret. Empty: `<fullname>-secrets`. It must differ from every
  # ExternalSecret and Secret that already exists in the namespace: Helm does not adopt them.
  # @section -- Secrets
  name: ""
  # -- How often External Secrets Operator reads the source again
  # @section -- Secrets
  refreshInterval: 1m
  # -- Secret store: `{name, kind}`, kind `ClusterSecretStore` or `SecretStore`
  # @section -- Secrets
  secretStoreRef:
    name: global-secret-store
    kind: ClusterSecretStore
  # -- Whole secrets to extract, e.g. `[{extract: {key: myapp/prod/keycloak}}]`. Set this or `data`.
  # @section -- Secrets
  dataFrom: []
  # -- Single keys, e.g. `[{secretKey: db-password, remoteRef: {key: myapp/prod/keycloak, property: password}}]`
  # @section -- Secrets
  data: []
  # -- `spec.target.template` of the ExternalSecret, passed as is (not through `tpl`, so its `{{ }}` reach External
  # Secrets Operator untouched). E.g. render a `keycloak.conf` from the fetched keys for the file mode of README
  # "Database and secrets"; in that file every `\` must be written as `\\` and every `$` as `$$`.
  # @section -- Secrets
  template: {}

# -- Stakater Reloader annotations on the StatefulSet. Inert without Reloader in the cluster.
# @section -- Secrets
reloader:
  # -- Annotate the StatefulSet for Reloader, so a changed Secret restarts the pods (one by one). Env vars are read
  # at start only: without Reloader a rotated Secret reaches Keycloak at the next restart.
  # @section -- Secrets
  enabled: true
  # -- `targeted`: `secret.reloader.stakater.com/reload` / `configmap.reloader.stakater.com/reload` with the Secrets
  # and ConfigMaps of the `database` references, `extraEnv`, `extraEnvFrom` and `extraVolumes`. Not the
  # `bootstrapAdmin` Secrets (a restart does not re-apply them) and not the TLS Secret (Keycloak reloads the files
  # itself).
  # `auto`: `reloader.stakater.com/auto: "true"`
  # @section -- Secrets
  mode: targeted

# -- Prometheus Operator ServiceMonitor (monitoring.coreos.com/v1) on the management port, path
# `<management path>/metrics`
# @section -- Monitoring
serviceMonitor:
  # -- Render the ServiceMonitor. Needs the Prometheus Operator CRDs.
  # @section -- Monitoring
  enabled: false
  # -- Labels the Prometheus `serviceMonitorSelector` matches, e.g. `release: kube-prometheus-stack`
  # @section -- Monitoring
  labels: {}
  # -- Scrape interval
  # @section -- Monitoring
  interval: 30s
  # -- Scrape timeout
  # @section -- Monitoring
  scrapeTimeout: 10s
  # -- RelabelConfigs applied before the scrape
  # @section -- Monitoring
  relabelings: []
  # -- RelabelConfigs applied to the samples, e.g. to drop histogram buckets
  # @section -- Monitoring
  metricRelabelings: []

# -- PodDisruptionBudget (policy/v1). Set exactly one of `maxUnavailable` and `minAvailable` (null the other).
# @section -- Scheduling
podDisruptionBudget:
  # -- Render the PodDisruptionBudget
  # @section -- Scheduling
  enabled: true
  # -- Pods a voluntary disruption may take down at once (number or percentage). 1 serialises node drains. With
  # one replica it still lets a drain evict the only pod.
  # @section -- Scheduling
  maxUnavailable: 1
  # -- Pods that must stay available (number or percentage). Set `maxUnavailable: null` to use it.
  # @section -- Scheduling
  minAvailable: null
  # -- `AlwaysAllow` lets a node drain evict pods that are not Ready (e.g. crash-looping) whatever the budget says.
  # Empty leaves the field out (Kubernetes default: `IfHealthyBudget`). The field needs Kubernetes 1.27, the chart's
  # `kubeVersion`.
  # @section -- Scheduling
  unhealthyPodEvictionPolicy: AlwaysAllow

# -- HorizontalPodAutoscaler (autoscaling/v2) on CPU. Memory is no signal for a JVM.
# @section -- Scheduling
# @default -- A complex object. Please check values below
autoscaling:
  # -- Render the HPA; `replicaCount` is then ignored. Turning it on for a running release removes `spec.replicas`
  # from the StatefulSet, which drops it to 1 pod once until the HPA acts: do it in a quiet window.
  # @section -- Scheduling
  enabled: false
  # -- Minimum replicas
  # @section -- Scheduling
  minReplicas: 3
  # -- Maximum replicas. Size the database for it: `maxReplicas` x `db-pool-max-size` connections.
  # @section -- Scheduling
  maxReplicas: 5
  # -- Average CPU utilization, in percent of `resources.requests.cpu`
  # @section -- Scheduling
  targetCPUUtilizationPercentage: 80
  # -- Average CPU per pod as an absolute value, e.g. `400m`. When set, it replaces
  # `targetCPUUtilizationPercentage`, so the threshold does not depend on `resources.requests.cpu`.
  # @section -- Scheduling
  targetCPUAverageValue: ""
  # -- HPA behavior. Scale down one pod per 2 minutes after a 300 s window, up fast. Do not copy a stateless default
  # here: authenticationSessions and actionTokens have 2 in-memory owners, so several Infinispan members leaving at
  # once lose in-flight logins.
  # @section -- Scheduling
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      selectPolicy: Min
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30

# -- Topology spread. A constraint without `labelSelector` gets the chart's selector labels. The defaults spread
# over zones and nodes but never block scheduling (`ScheduleAnyway`), like a preferred anti-affinity.
# @section -- Scheduling
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
# -- Affinity
# @section -- Scheduling
affinity: {}
# -- Node selector
# @section -- Scheduling
nodeSelector: {}
# -- Tolerations
# @section -- Scheduling
tolerations: []
# -- PriorityClass of the pods
# @section -- Scheduling
priorityClassName: ""

# -- Annotations of the pods (string values only). Do not put `karpenter.sh/do-not-disrupt: "true"` on every
# replica: it blocks consolidation and leaves expired nodes stuck draining; the PodDisruptionBudget already
# serialises drains.
# @section -- Extras
podAnnotations: {}
# -- Labels of the pods, merged with `commonLabels`; on the same key `podLabels` win. Not part of the selector. The
# keys the chart sets itself are rejected (see `commonLabels`).
# @section -- Extras
podLabels: {}
# -- Extra env vars of the Keycloak container (EnvVar list). They win over everything the chart sets: an entry
# replaces the chart's entry of the same name.
# @section -- Extras
extraEnv: []
# -- Extra envFrom sources of the Keycloak container
# @section -- Extras
extraEnvFrom: []
# -- Extra pod volumes, e.g. the Secret with a `keycloak.conf` (README "Database and secrets")
# @section -- Extras
extraVolumes: []
# -- Extra volume mounts of the Keycloak container
# @section -- Extras
extraVolumeMounts: []
# -- Extra init containers, run after the provider init containers
# @section -- Extras
initContainers: []
# -- Sidecar containers
# @section -- Extras
extraContainers: []
# -- Extra manifests, rendered with tpl
# @section -- Extras
extraObjects: []

# -- Post-install / post-upgrade Job that applies realm files with keycloak-config-cli (idempotent). Off by default.
# It logs in with `realmImport.auth` and reaches Keycloak through the chart's Service. Not rendered while Keycloak is
# scaled to zero (`replicaCount: 0` without autoscaling). Its pod inherits `imagePullSecrets`, `nodeSelector`,
# `tolerations`, the node affinity of `affinity` and `priorityClassName`, and runs under the `<fullname>-hooks`
# ServiceAccount.
# @section -- Hooks
# @default -- A complex object. Please check values below
realmImport:
  # -- Render the hook Job. Needs `image.tag`, `auth` and `realms` or `existingConfigMap`.
  # @section -- Hooks
  enabled: false
  # -- keycloak-config-cli image. Its tag carries the Keycloak version it was built for (e.g. `6.5.1-26.1.0`): pick
  # the one closest to `image.tag`. Required when enabled.
  # @section -- Hooks
  image:
    repository: docker.io/adorsys/keycloak-config-cli
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  # -- Master-realm credentials of the hook, in the `value` / `secretKeyRef` shape of `database`. Required when
  # enabled: `bootstrapAdmin` is not used, it only exists on a new database and is meant to be deleted. Either
  # `clientId` + `clientSecret` (recommended, wins when both are set): a client with service accounts enabled, the
  # `kc-admin-api` client scope (a new client does not get it by itself, and without it the Admin API answers 401)
  # and the master-realm role `create-realm`. That covers the realms the client creates itself. Each realm that
  # already exists (a migrated database, a realm created by the bootstrap account) additionally needs its
  # `<realm>-realm` client roles (preferred) or the `admin` role. Or `username` + `password`: an admin user,
  # password grant on `admin-cli`. The first run on a new database: README "Hooks".
  # @section -- Hooks
  # @default -- A complex object. Please check values below
  auth:
    # -- Client id (KEYCLOAK_CLIENTID)
    # @section -- Hooks
    clientId:
      value: ""
      secretKeyRef: {}
    # -- Client secret (KEYCLOAK_CLIENTSECRET). Secret only. Setting it selects the client-credentials grant.
    # @section -- Hooks
    clientSecret:
      secretKeyRef: {}
    # -- Admin user (KEYCLOAK_USER)
    # @section -- Hooks
    username:
      value: ""
      secretKeyRef: {}
    # -- Admin password (KEYCLOAK_PASSWORD). Secret only.
    # @section -- Hooks
    password:
      secretKeyRef: {}
  # -- ServiceAccount of the hook pod. Empty: `<fullname>-hooks`, which the chart creates without annotations for
  # the hook and test pods; its token is not mounted. Not Keycloak's own: the Job runs a third-party image, and the
  # EKS webhook would inject Keycloak's IRSA / Pod Identity credentials into it whatever
  # `automountServiceAccountToken` says.
  # @section -- Hooks
  serviceAccountName: ""
  # -- Realm files as `<file name>: <realm representation>` (real YAML, rendered to JSON in a ConfigMap). File names
  # are ConfigMap keys: `[-._a-zA-Z0-9]+`.
  # @section -- Hooks
  realms: {}
  # -- Use an existing ConfigMap of realm files instead of `realms`. Setting both is an error.
  # @section -- Hooks
  existingConfigMap: ""
  # -- IMPORT_VARSUBSTITUTION_ENABLED. Turn it on to reference secrets from realm files with `$(env:NAME)` and pass
  # them with `extraEnv`. Off by default: with it, whoever can edit the realm files can read the hook's env and
  # files through `$(env:...)` and `$(file:...)`.
  # @section -- Hooks
  varSubstitution: false
  # -- Hook events, comma separated
  # @section -- Hooks
  hooks: post-install,post-upgrade
  # -- `helm.sh/hook-delete-policy`, comma separated. Empty leaves the annotation out: Helm then applies
  # `before-hook-creation`.
  # @section -- Hooks
  deletePolicy: before-hook-creation,hook-succeeded
  # -- Retries of the Job
  # @section -- Hooks
  backoffLimit: 1
  # -- Deadline of the Job in seconds. The deploy tool's timeout must cover it too: a hook runs inside
  # `helm upgrade`.
  # @section -- Hooks
  activeDeadlineSeconds: 900
  # -- Extra env of the hook (EnvVar list). An entry with the name of a variable the chart sets replaces it.
  # @section -- Hooks
  extraEnv: []
  # -- Resources of the hook container
  # @section -- Hooks
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

# -- `helm test` pod: checks `/health/ready` and `/realms/master/.well-known/openid-configuration`, each up to 12
# times, 5 s apart (worst case about 2 minutes per check). Its pod inherits `imagePullSecrets`, `nodeSelector`,
# `tolerations`, the node affinity of `affinity` and `priorityClassName`, and runs under the `<fullname>-hooks`
# ServiceAccount.
# @section -- Hooks
# @default -- A complex object. Please check values below
tests:
  # -- Render the test pod. It needs running Keycloak pods: turn the test off in the deploy tool (Flux
  # `spec.test.enable`) while `replicaCount` is 0.
  # @section -- Hooks
  enabled: true
  # -- Image of the test pod (needs `sh`, `wget` and `grep`)
  # @section -- Hooks
  image:
    repository: docker.io/library/busybox
    tag: "1.37"
    digest: ""
    pullPolicy: IfNotPresent
  # -- Resources of the test container
  # @section -- Hooks
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      memory: 32Mi
