{{- if .Values.httpRoute.enabled }}
{{- $route := .Values.httpRoute }}
{{- if not $route.parentRefs }}
{{- fail "httpRoute.parentRefs is required when httpRoute.enabled" }}
{{- end }}
{{- $hostnames := list }}
{{- range $route.hostnames }}
{{- $hostnames = append $hostnames (tpl . $) }}
{{- end }}
{{- if and (not $hostnames) (include "keycloak.publicHost" .) }}
{{- $hostnames = list (include "keycloak.publicHost" .) }}
{{- end }}
{{- $backend := dict "name" (include "keycloak.fullname" .) "port" (include "keycloak.backendPort" . | int) }}
{{- $rules := list }}
{{- range $route.rules }}
{{- $rule := deepCopy . }}
{{- $redirect := false }}
{{- range $rule.filters }}
{{- if eq .type "RequestRedirect" }}{{ $redirect = true }}{{ end }}
{{- end }}
{{- /* A RequestRedirect rule must not have backendRefs; an explicit key, even [], is kept */}}
{{- if not (or (hasKey $rule "backendRefs") $redirect) }}
{{- $_ := set $rule "backendRefs" (list $backend) }}
{{- end }}
{{- $rules = append $rules $rule }}
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "keycloak.fullname" . }}
  labels:
    {{- include "keycloak.labels" . | nindent 4 }}
    {{- with $route.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with $route.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml $route.parentRefs | nindent 4 }}
  {{- with $hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $rules }}
  rules:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
