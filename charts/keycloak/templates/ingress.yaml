{{- $host := tpl (.Values.ingress.host | default "") . | default (include "keycloak.publicHost" .) }}
{{- if .Values.ingress.enabled }}
{{ include "keycloak.ingress" (dict "ctx" $ "name" (include "keycloak.fullname" .) "cfg" .Values.ingress "paths" .Values.ingress.paths "host" $host) }}
{{- end }}
{{- if .Values.ingress.admin.enabled }}
{{- $admin := .Values.ingress.admin }}
{{- $paths := $admin.paths | default (list (dict "path" (printf "%s/admin/" (include "keycloak.httpPath" .)) "pathType" "Prefix")) }}
{{- /* Keycloak redirects the console to hostname.adminUrl, so that host needs the rule */}}
{{- $adminHost := tpl ($admin.host | default "") . | default (include "keycloak.urlHost" (tpl (tpl (.Values.hostname.adminUrl | default "") .) .)) | default $host }}
---
{{ include "keycloak.ingress" (dict "ctx" $ "name" (include "keycloak.childName" (dict "ctx" . "suffix" "admin")) "cfg" $admin "paths" $paths "host" $adminHost) }}
{{- end }}
