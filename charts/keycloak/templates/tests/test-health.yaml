{{- if .Values.tests.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "keycloak.childName" (dict "ctx" . "suffix" "test") }}
  labels:
    {{- include "keycloak.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  enableServiceLinks: false
  {{- with .Values.podSecurityContext }}
  securityContext:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  containers:
    - name: health
      image: {{ include "keycloak.imageRef" .Values.tests.image }}
      imagePullPolicy: {{ .Values.tests.image.pullPolicy }}
      command:
        - sh
        - -c
        - |
          set -e
          wget -q -T 10 --no-check-certificate -O - "$0" | grep -q '"UP"'
          wget -q -T 10 --no-check-certificate -O - "$1" | grep -q '"issuer"'
        - {{ printf "%s://%s:%v%s/health/ready" (include "keycloak.managementScheme" . | lower) (include "keycloak.headlessName" .) .Values.http.managementPort (include "keycloak.managementPath" .) | quote }}
        - {{ printf "%s/realms/master/.well-known/openid-configuration" (include "keycloak.serviceUrl" .) | quote }}
      {{- with .Values.securityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tests.resources }}
      resources:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
