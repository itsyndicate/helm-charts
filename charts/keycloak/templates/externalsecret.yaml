{{- if .Values.externalSecret.enabled }}
{{- $es := .Values.externalSecret }}
{{- if not (or $es.dataFrom $es.data) }}
{{- fail "externalSecret.enabled: set externalSecret.dataFrom or externalSecret.data" }}
{{- end }}
{{- $name := include "keycloak.externalSecretName" . }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}
  labels:
    {{- include "keycloak.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    name: {{ $es.secretStoreRef.name }}
    kind: {{ $es.secretStoreRef.kind }}
  target:
    name: {{ $name }}
    creationPolicy: Owner
  {{- with $es.dataFrom }}
  dataFrom:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $es.data }}
  data:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
