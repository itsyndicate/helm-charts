{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "keycloak.serviceAccountName" . | quote }}
  labels:
    {{- include "keycloak.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
{{- if or .Values.realmImport.enabled .Values.tests.enabled }}
---
{{- /* The hook and test pods run other images: an account of their own, never Keycloak's (its annotations may carry
a cloud role) and never the namespace's shared default. A regular resource: it exists before the hooks run. */}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "keycloak.childName" (dict "ctx" . "suffix" "hooks") }}
  labels:
    {{- include "keycloak.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
